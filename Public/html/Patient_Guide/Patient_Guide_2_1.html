<!doctype html>
<html lang="zh-TW">

<head>
	{% include 'Public_head.html' %}
	<title>選擇科別_網路掛號_長安醫院</title>
	<!-- ※※ 引入導航列2 ※※ -->
	<script src="/Public/js/online_nav_load.js"></script>
	{% include 'GA_head.html' %}	
</head>

<body>
	{% include 'GA_noscript.html' %}
	<div class="wrapper L_sub_main_bg">

		<!-- ======= 本頁 Modal Area ======= -->
		<!-- ======= 本頁 Modal Area End ======= -->

		<!-- ======= navbar ======= -->
		{% include 'header.html' %}
		<!-- ======= navbar End ======= -->

		<!-- ======= main-content ======= -->
		<main class="pb-3 online_main">
			<div class="container py-1">
				<div class="row">
					<!-- ※※※ 功能內容 ※※※ -->
					<div class="col-12">
						<article>
							<div class="content">
								<!-- 麵包屑 -->
								<div class="text-right font-16">
									<nav aria-label="breadcrumb">
										<ol class="breadcrumb justify-content-end">
											<li class="breadcrumb-item main_pencil font-weight-bold"></li>
											<li class="breadcrumb-item Online_Appointment font-weight-bold"></li>
											<li class="breadcrumb-item active" aria-current="page">選擇科別</li>
										</ol>
									</nav>
								</div>
								<!-- 內容區 -->
								<div class="bg-white rounded panel-shadow title_wrap">
									<!-- 標題 -->
									<section id="content_h">
										<div class="onsale_heading">選擇科別</div>
										<hr class="my-2">
									</section>
									<!-- 細節 -->
									<section id="content_body">
										{% for subject,senames in datas %}
										<div class="row">
											<div class="col-12">
												<div class="baseline_title long_t cofe-word mt-3">
													<h3>{{ subject }}</h3>
												</div>
											</div>
											<div class="col-12">
												<div class="row my-3">
													{% for sename in senames %}
													<div class="col-12 col-md-3">
														<a href="/A006_Online_Booking_1_part?A006_sename={{ sename }}">
															<div class="trasition_site d_intro animate-from-bottom__0 mb-3 rounded">
																<div class="w-100 position-relative">
																	<div class="in_icon position-absolute">
																		<i class="fas fa-notes-medical darkcoco-word font-70"></i>
																	</div>
																	<div class="in_content position-relative"> 
																		<div class="in_title">
																			<span class="title_line_org">{{ sename }}</span>
																		</div>
																	</div>
																</div>
															</div>
														</a>
													</div>
													{% endfor %}
												</div>
											</div>
										</div>
										{% endfor %}
									</section>
								</div>
								<!-- 內容區 End -->
							</div>
						</article>	
					</div>
					<!-- ※※※ 功能內容 End ※※※ -->
				</div>
			</div>
		</main>
		<!-- ======= main End ======= -->
	</div>
	<!-- ======= footer ======= -->
	{% include 'footer.html' %}
	<!-- ======= Footer End ======= -->

</body>

</html>
