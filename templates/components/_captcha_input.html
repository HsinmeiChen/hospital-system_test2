<div class="form-group row align-items-center mb-0">
	<label for="{{ form.captcha.id_for_label }}" class="col-12 col-md-2 mark_arrow_title mb-2 mb-md-0">
		<h5 class="font-weight-bold mb-0" style="font-size: 1.1rem;">驗證碼<span class="text-danger">*</span></h5>
	</label>
	<div class="col-12 col-md-6 mb-2 mb-md-0">
		{{ form.captcha }}
		<small id="captcha-timer" class="form-text text-muted">驗證碼將於 <span id="countdown">2:00</span> 後失效</small>
		<div class="invalid-feedback captcha-feedback">請輸入驗證碼。</div>
		{% if form.captcha.errors %}
			<div class="invalid-feedback d-block">{{ form.captcha.errors.0 }}</div>
		{% endif %}
	</div>
	<div class="col-12 col-md-4 d-flex justify-content-end" style="gap: 8px;">
		<img id="captcha-img" src="/api/captcha/image/" alt="驗證碼圖片" class="img-fluid border" style="cursor: pointer;" title="點擊刷新驗證碼">
		<button type="button" class="btn btn-link border-0" id="refresh-captcha-btn" style="align-self: end;">
			<i class="fas fa-sync-alt" title="點擊刷新驗證碼"></i>
		</button>
	</div>
</div>
