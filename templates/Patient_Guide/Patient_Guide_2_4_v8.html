<!doctype html>
<html lang="zh-TW">
<head>
	{% include 'Public_head.html' %}
	<title>登入_網路掛號_長安醫院{{ errorMessage }}</title>
	{% include 'GA_head.html' %}
</head>

<body {% if errorMessageOn %} onload="error_message('{{ errorMessage }}');" {% endif %}>
	{% include 'GA_noscript.html' %}
	<div class="wrapper L_sub_main_bg">
		<!-- ======= 本頁 Modal Area ======= -->
		<div id="dialog-content" class="Booking_login">
			<!-- 登入失敗：是否要填初診資料進行預約 -->
			<div id="login_fair_to_first">
				<div class="message-icon message-warning message-icon-show">
					<div class="message-icon-content">!</div>
				</div>
				<div class="mb-2" style="padding: 0em 1em 0;font-weight: 600;text-align: center;margin: 0;word-wrap: break-word;max-width: 100%;color: inherit;font-size: 1.875em;">登入失敗！</div>
				<div class="mb-2" style="font-size: 1.125em;text-align: center;">資料不存在，您是否要填寫初診資料進行預約?</div>
				<div class="Confirm_btn_50 mt-4">
					<input type="submit" class="btn btn-success" value="確定" onclick='location.href=("/A006_Online_Booking_first/")'>
					<input type="button" class="btn btn-light" value="取消" data-fancybox-close="">
				</div>
			</div>
		</div>
		<!-- ======= 本頁 Modal Area End ======= -->

		<!-- ======= navbar ======= -->
		{% include 'header.html' %}
		<!-- ======= navbar End ======= -->

		<!-- ======= main-content ======= -->
		<main class="online_main">
			<div class="container py-1">
				<div class="row">
					<!-- ※※※ 功能內容 ※※※ -->
					<div class="col-12">
						<article>
							<div class="content">
								<!-- 麵包屑 -->
								<!-- <div class="text-right font-16">
									<nav aria-label="breadcrumb">
										<ol class="breadcrumb justify-content-end">
											<li class="breadcrumb-item main_pencil font-weight-bold"></li>
											<li class="breadcrumb-item Online_Appointment font-weight-bold"></li>
											<li class="breadcrumb-item Online_Appointment_part font-weight-bold"></li>
											<li class="breadcrumb-item active" aria-current="page">外科_骨科</li>
										</ol>
									</nav>
								</div> -->
								<!-- 內容區 -->
								<div class="keyin_data_div">
									<!-- 細節 -->
									<section id="content_body">
										<!-- ▼▼▼▼▼▼▼▼ 登入功能 ▼▼▼▼▼▼▼▼ -->
										<div id="booking_login">
											<div class="login_title">登入</div>
											<div>
												<form action="" method="POST" name="Form1" onsubmit="return CheckInput()">
													{% csrf_token %}
													<div class="form-group">
														<label for="ID_card" class="cofe-word mark_arrow_title">
															<h5 class="font-weight-bold mb-0">身分證字號:</h5>
														</label>
														<input type="text" class="form-control border-coco rounded-0 input2" id="ID_card" placeholder="" name="ID_card" required minlength="10" maxlength="10" pattern="\S*" title="不能输入空格" style="text-transform:uppercase;" value="{{user_acc}}">
													</div>
													<div class="form-group">
														<label for="Birthday" class="cofe-word mark_arrow_title">
														<h5 class="font-weight-bold mb-0">出生日期：</h5>
														</label>
														<input type="text" class="form-control border-coco rounded-0 input2" id="Birthday" placeholder="民國 52 年 1 月 8 號，請輸入 0520108" name="Birthday" required minlength="7" maxlength="7" pattern="\S*" title="不能输入空格" value="{{user_pwd}}">
													</div>
<!-- 													<div class="form-inline">
														<label for="vcode" class="cofe-word mark_arrow_title">
														<h5 class="font-weight-bold mb-0">驗證碼：</h5>
														</label>
														<input type="text" name="verifycode" class="form-control border-coco rounded-0 input2" id="verifycode" placeholder="請輸入驗證碼" style="width: 120px;" required>
														<a href="javascript:refreshcode();">
															<img src="CheckCodeServlet" title="看不清點擊刷新" id="vcode" />
														</a>
													</div> -->
													<hr />
													<!-- 效果：登入成功 -->
													<div class="Confirm_btn_100">
														<input type="submit" class="btn btn-success" value="登入">
													</div>
													<!-- 效果：登入失敗 -->
<!-- 													<div class="Confirm_btn_100 mt-1">
														<input type="submit" class="btn btn-success" value="登入失敗" data-fancybox data-src="#dialog-content">
													</div> -->
												</form>
												<script>
													function CheckInput() {
													   if ( ! checkID( document.Form1.ID_card.value ) ){
													      window.alert( "身份證字號錯誤!" );
													  	  return false;
													  	}
													   else if ( ! checkBirthday( document.Form1.Birthday.value ) ){
													      window.alert( "生日格式錯誤!" );
													  	  return false;
													   }
													   else{
													   	  return true;
													   	}
													}

													function checkID( idStr ) {
														// 依照字母的編號排列，存入陣列備用。
														var letters = new Array('A', 'B', 'C', 'D', 
														      'E', 'F', 'G', 'H', 'J', 'K', 'L', 'M', 
														      'N', 'P', 'Q', 'R', 'S', 'T', 'U', 'V', 
														      'X', 'Y', 'W', 'Z', 'I', 'O');
														// 儲存各個乘數
														var multiply = new Array(1, 9, 8, 7, 6, 5, 
														                         4, 3, 2, 1);
														var nums = new Array(2);
														var firstChar;
														var firstNum;
														var lastNum;
														var total = 0;
														// 撰寫「正規表達式」。第一個字為英文字母，
														// 第二個字為1或2，後面跟著8個數字，不分大小寫。
														var regExpID=/^[a-z](1|2)\d{8}$/i;

														// 使用「正規表達式」檢驗格式
														if (idStr.search(regExpID)==-1) {
															// 2025/1/16 為了讓外籍人士可以登陸掛號，先不判斷身分證字號格式
															return true;
														} else {
															// 取出第一個字元和最後一個數字。
															firstChar = idStr.charAt(0).toUpperCase();
															lastNum = idStr.charAt(9);
														}

														// 找出第一個字母對應的數字，並轉換成兩位數數字。
														for (var i=0; i<26; i++) {
															if (firstChar == letters[i]) {
															  firstNum = i + 10;
															  nums[0] = Math.floor(firstNum / 10);
															  nums[1] = firstNum - (nums[0] * 10);
															  break;
															} 
														}

														// 執行加總計算
														for(var i=0; i<multiply.length; i++){
														  if (i<2) {
														    total += nums[i] * multiply[i];
														  } else {
														    total += parseInt(idStr.charAt(i-1)) * multiply[i];
														  }
														}

														// 和最後一個數字比對
														if (((10 - (total % 10))%10) != lastNum) {
															return false;
														}

														return true;
													}

													function checkBirthday( birthDay ){
														var nowYear = new Date().getFullYear() - 1911;

														if (birthDay.substring(0,3) > nowYear){
															return false;
														}

														if ( ! (parseInt(birthDay.substring(3,5)) > 0) || ! (parseInt(birthDay.substring(3,5)) < 13)) {
															return false;
														}

														if ( ! (parseInt(birthDay.substring(5,7)) > 0) || ! (parseInt(birthDay.substring(5,7)) < 32)) {
															return false;
														}

														return true;
													}
												</script>
											</div>
										</div>
									</section>
								</div>
								<!-- 內容區 End -->
							</div>
						</article>	
					</div>
					<!-- ※※※ 功能內容 End ※※※ -->
				</div>
			</div>
		</main>
		<!-- ======= main End ======= -->
	</div>
	<!-- ======= footer ======= -->
	{% include 'footer.html' %}
	<!-- ======= Footer End ======= -->
</body>

</html>
