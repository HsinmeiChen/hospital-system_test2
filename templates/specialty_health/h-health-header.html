{% load static %}
<div id="m-header-root">
	<header class="m-header" id="m-header">
		<div class="m-header__container">
			<!-- Logo (GEO: 在地標記強化) -->
			<div class="m-header__logo">
				<a href="/specialty_health/" title="回首頁 - 長安健康管理中心">
					<img src="{% get_media_prefix %}specialty_health/health_logo.webp" alt="長安健康管理中心">
				</a>
			</div>

			<!-- Desktop Nav (SEO: Schema.org 結構) -->
			<nav class="m-nav" itemscope itemtype="http://schema.org/SiteNavigationElement">
				<ul class="m-nav__list">

					<!-- 1. 關於我們 -->
					<li class="m-nav__item">
						<a href="/specialty_health/health-about/" class="m-nav__link" itemprop="url" title="關於我們">
							<span itemprop="name">關於我們</span>
						</a>
					</li>

					<!-- 2. 醫師陣容 -->
					<li class="m-nav__item">
						<a href="/specialty_health/health-doctor/" class="m-nav__link" itemprop="url" title="醫師陣容">
							<span itemprop="name">醫師陣容</span>
						</a>
					</li>

					<!-- 3. 健檢專案 -->
					<li class="m-nav__item">
						<a href="/specialty_health/health-treatment/" class="m-nav__link" itemprop="url" title="健檢專案">
							<span itemprop="name">健檢專案</span>
						</a>
					</li>

					<!-- 4. 最新消息 -->
					<li class="m-nav__item">
						<a href="/specialty_health/health-news/" class="m-nav__link" itemprop="url" title="最新消息">
							<span itemprop="name">最新消息</span>
						</a>
					</li>					

					<!-- 5. 衛教資訊 -->
					<li class="m-nav__item">
						<a href="/specialty_health/health-health-film/" class="m-nav__link" itemprop="url" title="衛教資訊">
							<span itemprop="name">衛教資訊</span>
						</a>
					</li>

					<!-- 5. 聯絡我們 -->
					<li class="m-nav__item m-nav__item--btn">
						<a href="/specialty_health/contact/" id="emailBtn" title="聯絡我們" itemprop="url" class="m-nav__link">                      
							<span itemprop="name">
								<i class="fas fa-envelope" aria-hidden="true"></i> 聯絡我們
							</span>
						</a>
					</li>

					<!-- 6. 回長安醫院 -->
					<li class="m-nav__item m-nav__item--btn">
						<a href="/index/" id="homeBtn" class="m-nav__link btn-icon-circle" title="回長安醫院" itemprop="url">
							<i class="fas fa-home" aria-hidden="true"></i>
							<span class="btn-icon-text" itemprop="name">長安<br/>醫院</span>
						</a>
					</li>
				</ul>
			</nav>

			<!-- 行動版切換器 -->
			<button class="m-hamburger" id="m-toggle" aria-label="切換導覽選單">
				<span></span><span></span><span></span>
			</button>
		</div>
	</header>

	<!-- 行動版側邊導覽 -->
	<div class="m-overlay" id="m-overlay"></div>
	<nav class="m-mobile-sidebar" id="m-sidebar" aria-label="行動版導覽">
		<div class="m-mobile-container" id="m-mobile-container">
			<!-- 行動版選單由 site_main.js 自動根據桌機版選單同步生成 -->
			<!-- 僅需維護上面的 <nav class="m-nav"> 即可同步更新行動版 -->

		</div>
	</nav>
</div>
