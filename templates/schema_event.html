<!-- [SEO/GEO 整合] Event (活動/講座) 專用結構化資料模組 -->
<!-- 應用情境：「健康講座」、「義診活動」、「社區篩檢活動」 -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "name": "{{ event_name }}",
  "description": "{{ description|striptags|truncatechars:150 }}",
  "startDate": "{{ start_date|default:'2025-01-01T09:00' }}",
  "location": { 
    "@type": "Hospital",
    "@id": "{{ SITE_DOMAIN }}/#hospital",
    "name": "台中長安醫院{% if center_name %}{{ center_name }}{% endif %}"
  },
  "organizer": {
    "@type": "Hospital",
    "@id": "{{ SITE_DOMAIN }}/#hospital",
    "name": "台中長安醫院{% if center_name %}{{ center_name }}{% endif %}"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ SITE_DOMAIN }}{{ request.path }}"
  }
}
</script>
