<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: '微軟正黑體', Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .header { background-color: #f8f9fa; padding: 15px; border-bottom: 2px solid #0056b3; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #0056b3; }
        .content table { width: 100%; border-collapse: collapse; }
        .content th, .content td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .content th { width: 30%; background-color: #fcfcfc; color: #555; }
        .footer { margin-top: 30px; font-size: medium; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ subject_title|default:"系統通知" }}</h2>
        </div>
        <div class="content">
            <p>您好，系統收到一筆新的客服信件，內容如下：</p>
            <table>
                <tbody>
                    {% for label, value in form_data.items %}
                    <tr>
                        <th>{{ label }}</th>
                        <td>{{ value|linebreaksbr|default:"(未填寫)" }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="footer">
            <p>此信件由『長安醫院』官網自動發送，請勿直接回覆。</p>
        </div>
    </div>
</body>
</html>
