<!-- [SEO/GEO] Medical Service -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MedicalProcedure",
  "name": "{{ service_name }}",
  "description": "{{ description|striptags|truncatechars:150 }}",
  "provider": { 
    "@type": "Hospital",
    "@id": "{{ SITE_DOMAIN }}/#hospital",
    "name": "台中長安醫院{% if center_name %}{{ center_name }}{% endif %}"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ SITE_DOMAIN }}{{ request.path }}"
  },
  "isPartOf": {
    "@id": "{{ SITE_DOMAIN }}/#website"
  }
}
</script>
