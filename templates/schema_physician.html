<!-- [SEO/GEO] ProfilePage + Physician 終極結構化資料模組 -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "@id": "{{ SITE_DOMAIN }}{{ request.path }}#webpage",
  "url": "{{ SITE_DOMAIN }}{{ request.path }}",
  "name": "{{ name }}｜醫師介紹｜台中長安醫院{% if center_name %}{{ center_name }}{% endif %}",
  "isPartOf": {
    "@id": "{{ SITE_DOMAIN }}/#website"
  },
  "mainEntity": {
    "@type": "Physician",
    "@id": "{{ SITE_DOMAIN }}{{ request.path }}#physician",
    "name": "{{ name }}",
    "image": "{{ SITE_DOMAIN }}{{ MEDIA_URL }}department/img/{{ image|cut:' ' }}",
    "medicalSpecialty": "{{ specialty }}",
    "description": "{{ description|striptags|truncatechars:150 }}",
    "hospitalAffiliation": {
      "@type": "Hospital",
      "@id": "{{ SITE_DOMAIN }}/#hospital",
      "name": "台中長安醫院{% if center_name %}{{ center_name }}{% endif %}",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "太平區",
        "addressRegion": "台中市",
        "streetAddress": "永平路一段9號"
      }
    },
    "knowsAbout": [{% for e in expertise %}"{{ e }}"{% if not forloop.last %},{% endif %}{% endfor %}],
    "url": "{{ SITE_DOMAIN }}{{ request.path }}",
    "memberOf": { "@id": "{{ SITE_DOMAIN }}/#hospital" }
  }
}
</script>
