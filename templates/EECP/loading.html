{% load static %}
<div id="page-loading">
    <div class="back"></div>
    
    <!-- EECP 專屬 Loading 設計 -->
    <div class="eecp-loading-container">
        <!-- Logo 圖片（血液循環效果） -->
        <div class="logo-pulse-wrapper">
            <img src="{% static 'common/img/single-logo.png' %}" alt="EECP Logo" class="eecp-logo">
            <!-- 血液循環粒子 -->
            <div class="blood-particle blood-particle-1"></div>
            <div class="blood-particle blood-particle-2"></div>
            <div class="blood-particle blood-particle-3"></div>
            <div class="blood-particle blood-particle-4"></div>
            <div class="blood-particle blood-particle-5"></div>
            <div class="blood-particle blood-particle-6"></div>
            <div class="blood-particle blood-particle-7"></div>
            <div class="blood-particle blood-particle-8"></div>
        </div>

        <!-- EECP 文字與狀態 -->
        <div class="loading-info">
            <div class="eecp-title">EECP 體外反搏</div>
            <div class="loading-status">
                <span class="status-text">網頁讀取中</span>
                <div class="status-dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
            <!-- 進度條 -->
            <div class="progress-bar-container">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                    <div class="progress-glow"></div>
                </div>
            </div>
        </div>
    </div>
</div>
