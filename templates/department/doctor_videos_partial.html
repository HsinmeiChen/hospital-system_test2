{% load static %}
<div class="doctor_mov">
	{% for m in video_contacts %}
	<div class="spacing_mp">
		<a href="#" data-toggle="modal" data-target="#shared-video-modal" 
   data-video-id="{{ m.youtube_id }}" 
   data-video-title="{% firstof m.title m.name %}">
			<div class="media_new info_card transform_result">
				<div>
					<img class="" src="{{m.youtube_image}}" alt="">
				</div>
			</div>
		</a>
	</div>
	{% endfor %}
</div>

<!-- === AJAX 分頁頁碼 === -->
{% if video_contacts.paginator.count > video_contacts.paginator.per_page %}
<div class="row w-100 mx-0 mt-3">
    <div class="col-12 d-flex justify-content-center align-items-center">
        <ul class="pagination align-items-center" id="video-pagination-list">
            <!-- << First Page -->
            <li class="page-item {% if not video_contacts.has_previous %}disabled{% endif %}">
               <a class="page-link" href="{{ video_url }}&video_page=1" data-no-loading data-ajax-target="#doctor_videos_container" data-ajax-scroll="#doctor_videos_title" aria-label="First">«</a>
            </li>
            
            <!-- < Previous Page -->
            <li class="page-item {% if not video_contacts.has_previous %}disabled{% endif %}">
                <a class="page-link" href="{{ video_url }}&video_page={% if video_contacts.has_previous %}{{ video_contacts.previous_page_number }}{% else %}1{% endif %}" data-no-loading data-ajax-target="#doctor_videos_container" data-ajax-scroll="#doctor_videos_title" aria-label="Previous">‹</a>
            </li>
            
            <!-- Dropdown Selection (第 {{ 頁碼 }} 頁) -->
            <li class="page-item">
                <select class="form-control pagination-select doctor-videos-select" data-url-base="{{ video_url }}" data-param-name="video_page" data-ajax-target="#doctor_videos_container" data-ajax-scroll="#doctor_videos_title" style="display: inline-block; width: auto; height: 40px; border-radius: 0; border: 1px solid var(--color-border-light); font-size: 0.9rem; color: var(--color-text-dark); background-color: var(--color-bg-white);">
                    {% for p in video_contacts.paginator.page_range %}
                        <option value="{{ p }}" {% if p == video_contacts.number %}selected{% endif %}>第 {{ p }} 頁</option>
                    {% endfor %}
                </select>
            </li>
            
            <!-- > Next Page -->
            <li class="page-item {% if not video_contacts.has_next %}disabled{% endif %}">
                <a class="page-link" href="{{ video_url }}&video_page={% if video_contacts.has_next %}{{ video_contacts.next_page_number }}{% else %}{{ video_contacts.paginator.num_pages }}{% endif %}" data-no-loading data-ajax-target="#doctor_videos_container" data-ajax-scroll="#doctor_videos_title" aria-label="Next">›</a>
            </li>
            
            <!-- >> Last Page -->
            <li class="page-item {% if not video_contacts.has_next %}disabled{% endif %}">
                <a class="page-link" href="{{ video_url }}&video_page={{ video_contacts.paginator.num_pages }}" data-no-loading data-ajax-target="#doctor_videos_container" data-ajax-scroll="#doctor_videos_title" aria-label="Last">»</a>
            </li>
        </ul>
    </div>
</div>
{% endif %}
